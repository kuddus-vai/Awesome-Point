<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Awesome Point | অসাম পয়েন্ট — প্রিমিয়াম মেনস ফ্যাশন ও স্ট্রিটওয়্যার</title>
    <!-- Redirect script for GitHub Pages SPA routing -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current URL and redirects to the index.html with the query parameters preserved.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var segment = l.pathname.split('/').slice(1, 1 + pathSegmentsToKeep).join('/');
      var repo = segment ? '/' + segment : '';
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repo + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <div style="text-align: center; padding-top: 100px; font-family: sans-serif;">
      <h2>Redirecting to Awesome Point...</h2>
    </div>
  </body>
</html>
